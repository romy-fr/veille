<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modèles · Z500 & pression · J+0 → J+6</title>
<style>
  :root { --bg:#f6f6f4; --card:#fff; --ink:#1b1b1b; --mute:#6b6b6b; --line:#e3e3df; --accent:#1f62d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141414; --card:#1e1e1e; --ink:#f0f0ee; --mute:#9a9a96; --line:#2e2e2c; --accent:#6ea0ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { max-width:1400px; margin:0 auto; padding:18px 16px 6px; display:flex; flex-wrap:wrap;
           align-items:baseline; justify-content:space-between; gap:6px 16px; }
  h1 { font-size:20px; font-weight:600; margin:0; }
  .sub { color:var(--mute); font-size:13px; }
  .bar { position:sticky; top:0; z-index:2; background:var(--bg); border-bottom:1px solid var(--line); }
  .ctrl { max-width:1400px; margin:0 auto; padding:10px 16px 12px; display:grid;
          grid-template-columns:auto 1fr auto; gap:6px 14px; align-items:center; }
  .when { grid-column:1 / -1; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .when b { font-size:22px; font-weight:600; }
  .when span { color:var(--mute); }
  button { border:1px solid var(--line); background:var(--card); color:var(--ink); border-radius:8px;
           width:38px; height:34px; font-size:15px; cursor:pointer; }
  button:hover { border-color:var(--mute); }
  .btns { display:flex; gap:6px; }
  input[type=range] { width:100%; accent-color:var(--accent); height:28px; }
  .ticks { grid-column:2; display:flex; justify-content:space-between; font-size:11px; color:var(--mute);
           margin-top:-6px; }
  main { max-width:1400px; margin:0 auto; padding:14px 16px 28px; display:grid;
         grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; }
  @media (max-width:520px) { main { gap:6px; padding:8px 6px 20px; } }
  figure { margin:0; background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; }
  figure img { display:block; width:100%; height:auto; }
  .missing { aspect-ratio:1.33; display:flex; flex-direction:column; align-items:center; justify-content:center;
             color:var(--mute); gap:4px; text-align:center; padding:20px; }
  .missing strong { color:var(--ink); font-size:18px; }
  footer { max-width:1400px; margin:0 auto; padding:0 16px 24px; color:var(--mute); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Géopotentiel 500 hPa & pression au sol</h1>
  <div class="sub" id="meta">Chargement…</div>
</header>
<div class="bar">
  <div class="ctrl">
    <div class="when"><b id="jlabel">–</b><span id="dlabel"></span></div>
    <div class="btns">
      <button id="prev" title="Échéance précédente (←)">◀</button>
      <button id="play" title="Lecture / pause (espace)">▶︎</button>
      <button id="next" title="Échéance suivante (→)">▶</button>
    </div>
    <input id="slider" type="range" min="0" max="0" step="1" value="0" aria-label="Échéance">
    <div></div>
    <div class="ticks" id="ticks"></div>
  </div>
</div>
<main id="grid"></main>
<footer>Cartes reconstruites à partir des données ouvertes : NOAA (GFS et AIGFS, domaine public) ·
  ECMWF (IFS et AIFS, CC BY 4.0) · fonds de carte Natural Earth. En haut les modèles physiques, en bas leurs versions IA.</footer>
<script>
const ORDER = ["gfs", "ifs", "aigfs", "aifs"];   // GFS | IFS en haut, leurs IA en bas
const fmtDay = new Intl.DateTimeFormat("fr-FR", { weekday:"long", day:"numeric", month:"long", timeZone:"Europe/Paris" });
const fmtHour = new Intl.DateTimeFormat("fr-FR", { hour:"2-digit", minute:"2-digit", timeZone:"Europe/Paris" });
const fmtRun = new Intl.DateTimeFormat("fr-FR", { day:"2-digit", month:"2-digit", hour:"2-digit", timeZone:"UTC" });
let M, offsets = [], idx = 0, timer = null;

function cell(key) {
  const fig = document.createElement("figure");
  fig.id = "f-" + key;
  document.getElementById("grid").appendChild(fig);
  return fig;
}

function show(i) {
  idx = (i + offsets.length) % offsets.length;
  const off = offsets[idx];
  document.getElementById("slider").value = idx;
  const valid = new Date(new Date(M.base).getTime() + off * 3600e3);
  const day = Math.floor(off / 24);
  document.getElementById("jlabel").textContent = `J+${day} · +${off} h`;
  document.getElementById("dlabel").textContent =
    `${fmtDay.format(valid)} à ${fmtHour.format(valid)} (heure de Paris)`;
  for (const key of ORDER) {
    const m = M.modeles[key], fig = document.getElementById("f-" + key);
    const file = m && m.images[String(off)];
    if (file) {
      let img = fig.querySelector("img");
      if (!img) { fig.innerHTML = ""; img = document.createElement("img"); fig.appendChild(img); }
      img.alt = `${m.titre}, +${off} h`;
      img.src = file;
    } else {
      fig.innerHTML = `<div class="missing"><strong>${m ? m.titre : key.toUpperCase()}</strong>
        <span>${m && m.statut === "ok" ? "Pas de sortie à cette échéance" : "Modèle indisponible aujourd'hui"}</span></div>`;
    }
  }
  // Précharge l'échéance suivante pour une lecture fluide
  const nxt = offsets[(idx + 1) % offsets.length];
  for (const key of ORDER) {
    const f = M.modeles[key] && M.modeles[key].images[String(nxt)];
    if (f) new Image().src = f;
  }
}

function togglePlay() {
  const b = document.getElementById("play");
  if (timer) { clearInterval(timer); timer = null; b.textContent = "▶︎"; return; }
  timer = setInterval(() => show(idx + 1), 900);
  b.textContent = "❚❚";
}

fetch("manifest.json", { cache:"no-store" }).then(r => r.json()).then(data => {
  M = data; offsets = M.offsets;
  ORDER.forEach(cell);
  const s = document.getElementById("slider");
  s.max = offsets.length - 1;
  s.addEventListener("input", e => show(+e.target.value));
  document.getElementById("prev").onclick = () => show(idx - 1);
  document.getElementById("next").onclick = () => show(idx + 1);
  document.getElementById("play").onclick = togglePlay;
  document.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft") show(idx - 1);
    if (e.key === "ArrowRight") show(idx + 1);
    if (e.key === " ") { e.preventDefault(); togglePlay(); }
  });
  document.getElementById("ticks").innerHTML =
    [...new Set(offsets.map(o => Math.floor(o / 24)))].map(d => `<span>J+${d}</span>`).join("");
  const runs = ORDER.filter(k => M.modeles[k] && M.modeles[k].run)
    .map(k => `${M.modeles[k].titre} ${fmtRun.format(new Date(M.modeles[k].run)).replace(" ", " ")}h`);
  document.getElementById("meta").textContent =
    (M.demo ? "Démonstration : champs simulés, pas une vraie prévision — " : "") +
    `Runs : ${runs.join(" · ") || "aucun"} — mis à jour ${new Date(M.genere_le).toLocaleString("fr-FR", { timeZone:"Europe/Paris" })}`;
  show(offsets.length - 1);   // ouvre sur J+6
}).catch(() => { document.getElementById("meta").textContent = "manifest.json introuvable"; });
</script>
</body>
</html>
